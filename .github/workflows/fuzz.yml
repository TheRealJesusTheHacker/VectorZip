name: Fuzz decompressor

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'tests/**'
  schedule:
    - cron: '0 3 * * 0'  # weekly, Sunday 03:00 UTC

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz decompress
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v5
        with:
          python-version: "3.11"
      - name: Run decompressor fuzzer
        run: python tests/fuzz_decompress.py --seconds 300
