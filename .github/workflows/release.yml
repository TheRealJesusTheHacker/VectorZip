name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.lock.txt
          pip install --require-hashes -r requirements-build.lock.txt
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm vectorzip.spec
      - name: Frozen app start smoke (offscreen Qt)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath "dist\VectorZip.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "VectorZip.exe exited during the start smoke with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Start smoke OK: the frozen app was still running after 12s"
      - name: Assemble the portable edition
        run: python packaging/portable/build-portable.py --binary dist/VectorZip.exe --output dist/VectorZipPortable.zip
      - name: Generate SHA256 hashes
        shell: pwsh
        run: |
          cd dist
          @("VectorZip.exe", "VectorZipPortable.zip") | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash, $_ } | Out-File -Encoding ascii SHA256SUMS-windows.txt
          Get-Content SHA256SUMS-windows.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-path: |
            dist/*.exe
            dist/VectorZipPortable.zip
            dist/SHA256SUMS-windows.txt
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.exe
            dist/VectorZipPortable.zip
            dist/SHA256SUMS-windows.txt

  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install system dependencies (Qt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libxkbcommon0 libdbus-1-3
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.lock.txt
          pip install --require-hashes -r requirements-build.lock.txt
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm vectorzip.spec
      - name: Assemble the portable edition
        run: python packaging/portable/build-portable.py --binary dist/VectorZip --output dist/VectorZipPortable-linux.zip
      - name: Generate SHA256 hashes
        run: |
          cd dist
          sha256sum VectorZip VectorZipPortable-linux.zip > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-path: |
            dist/VectorZip
            dist/VectorZipPortable-linux.zip
            dist/SHA256SUMS-linux.txt
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/VectorZip
            dist/VectorZipPortable-linux.zip
            dist/SHA256SUMS-linux.txt
