name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compile:
    name: Compile check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Byte-compile every module
        run: python -m compileall -q src gui main.py gui_launcher.py

  compile-windows:
    name: Compile check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install runtime dependencies (hash-verified)
        run: pip install --require-hashes -r requirements.lock.txt
      - name: Byte-compile every module
        run: python -m compileall -q src gui main.py gui_launcher.py

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install system dependencies (Qt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libxkbcommon0 libdbus-1-3
      - name: Install dev dependencies (hash-verified)
        run: pip install --require-hashes -r requirements-dev.lock.txt
      - name: Run test suite
        run: python -m pytest tests/ -v

  test-windows:
    name: Unit tests + frozen start smoke (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dev dependencies (hash-verified)
        run: pip install --require-hashes -r requirements-dev.lock.txt
      - name: Run the full test suite on Windows
        run: python -m pytest tests/ -v
      - name: Build the frozen app (same spec as releases)
        run: |
          pip install --require-hashes -r requirements-build.lock.txt
          pyinstaller --noconfirm vectorzip.spec
      - name: Frozen app start smoke (offscreen Qt)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath "dist\VectorZip.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "VectorZip.exe exited during the start smoke with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Start smoke OK: the frozen app was still running after 12s"

  lint:
    name: Lint & format check (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install linters (pinned, hash-verified)
        run: pip install --require-hashes -r requirements-lint.lock.txt
      - name: Ruff
        run: ruff check src main.py gui_launcher.py gui tests
      - name: Black format check
        run: black --check --skip-string-normalization -l 100 src main.py gui_launcher.py gui tests

  cli-roundtrip:
    name: CLI compress/decompress round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install runtime dependencies (hash-verified)
        run: pip install --require-hashes -r requirements.lock.txt
      - name: Build a mixed test file (compressible text + random bytes)
        run: |
          python -c "import os; open('roundtrip.bin','wb').write(b'VectorZip round-trip fixture. ' * 20000 + os.urandom(200000) + open('main.py','rb').read() * 4)"
      - name: Compress then decompress with the vzip CLI
        run: |
          python main.py compress roundtrip.bin
          python main.py decompress roundtrip.bin.vzip
      - name: Outputs must be byte-identical
        run: cmp roundtrip.bin roundtrip.bin.restored
